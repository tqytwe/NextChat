appId: com.jisudeng.chat
name: Expired login refreshes and kept Keystore credentials restore login
tags:
  - fixture
---
- tapOn: "首页|Home|ホーム|홈"
- extendedWaitUntil:
    visible: "dashboard-default-group"
    timeout: 45000
- tapOn: "我的|Me|マイページ|내 정보"
- extendedWaitUntil:
    visible: "Account|账户"
    timeout: 10000
- scrollUntilVisible:
    element: "account-logout"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: "account-logout"
- extendedWaitUntil:
    visible: "logout-keep-account"
    timeout: 5000
- tapOn: "logout-keep-account"
- extendedWaitUntil:
    visible: "login-email"
    timeout: 20000
- assertVisible: "login-password"
- tapOn: "login-submit"
- extendedWaitUntil:
    visible: "dashboard-default-group"
    timeout: 30000
