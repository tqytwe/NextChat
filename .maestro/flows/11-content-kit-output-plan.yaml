appId: com.jisudeng.chat
name: Content kit exposes production output plans before generating
tags:
  - core
---
- launchApp:
    clearState: false
- runFlow: ../subflows/ensure-login.yaml
- tapOn: "open-content-kit"
- tapOn: "New project|新建项目"
- assertVisible: "content-kit-preset-ecommerce"
- tapOn: "content-kit-preset-brand"
- scrollUntilVisible:
    element: "content-kit-generate"
    direction: DOWN
    timeout: 10000
- assertVisible: "7 images planned in this run|本批计划 7 张"
- scrollUntilVisible:
    element: "content-kit-preset-custom"
    direction: UP
    timeout: 10000
- tapOn: "content-kit-preset-custom"
- assertVisible: "content-kit-preset-custom"
- scrollUntilVisible:
    element: "More settings|更多设置"
    direction: DOWN
    timeout: 10000
- tapOn: "More settings|更多设置"
- scrollUntilVisible:
    element: "Product consistency|商品一致性"
    direction: DOWN
    timeout: 10000
- assertVisible: "Product consistency|商品一致性"
