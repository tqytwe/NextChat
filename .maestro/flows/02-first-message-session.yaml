appId: com.jisudeng.chat
name: First message creates the chat session
tags:
  - core
---
- launchApp:
    clearState: false
- runFlow: ../subflows/ensure-login.yaml
- tapOn: "dashboard-new-chat"
- assertVisible: "chat-draft-no-session"
- tapOn: "chat-composer"
- inputText: "maestro-first-message-session"
- hideKeyboard
- tapOn: "发送|Send|送信|보내기"
- assertVisible: "maestro-first-message-session"
- assertNotVisible: "chat-draft-no-session"
- assertVisible: "chat-message-user-1"
