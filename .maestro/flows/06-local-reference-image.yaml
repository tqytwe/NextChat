appId: com.jisudeng.chat
name: Reference image capability is explicit and local when compatible
tags:
  - fixture
---
- runFlow: ../subflows/ensure-login.yaml
- tapOn: "app-tab-image"
- tapOn: "image-add-reference"
- tapOn:
    id: "com.google.android.providers.media.module:id/icon_thumbnail"
    index: 0
- tapOn:
    id: "com.google.android.providers.media.module:id/button_add"
- assertVisible: "image-clear-references"
- runFlow:
    when:
      visible: ".*(does not support|不支持).*"
    file: ../subflows/reference-capability-unsupported.yaml
- runFlow:
    when:
      notVisible: ".*(does not support|不支持).*"
    file: ../subflows/reference-capability-compatible.yaml
