appId: com.jisudeng.chat
name: Android owns long press selection and copy
tags:
  - core
---
- launchApp:
    clearState: false
- runFlow: ../subflows/ensure-login.yaml
- tapOn: "dashboard-new-chat"
- tapOn: "chat-composer"
- inputText: "maestro-native-selection-message"
- hideKeyboard
- tapOn: "发送|Send|送信|보내기"
- assertVisible: "maestro-native-selection-message"
- longPressOn: "maestro-native-selection-message"
- assertVisible:
    text: "复制|Copy"
